<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Openly | A quieter way to think</title>
	<style>
		:root {
			--ink: #20252b;
			--muted: #77808a;
			--line: #e6e8e4;
			--paper: #fbfbf8;
			--panel: #f2f4f1;
			--white: #ffffff;
			--teal: #b8e4d2;
			--teal-deep: #166957;
			--coral: #ff896f;
			--shadow: 0 18px 50px rgba(31, 44, 45, .08);
		}

		* { box-sizing: border-box; }
		html { scroll-behavior: smooth; }
		body {
			margin: 0;
			color: var(--ink);
			background: var(--paper);
			font-family: Georgia, 'Times New Roman', serif;
			min-height: 100vh;
		}
		button, textarea { font: inherit; }
		button { cursor: pointer; }
		.app { display: flex; min-height: 100vh; }
		.sidebar {
			width: 248px;
			padding: 22px 16px;
			background: #f0f3ee;
			border-right: 1px solid var(--line);
			display: flex;
			flex-direction: column;
			flex-shrink: 0;
		}
		.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 30px; }
		.brand-mark {
			width: 28px; height: 28px; border-radius: 9px 9px 9px 2px;
			display: grid; place-items: center; background: var(--ink); color: var(--teal);
			font-size: 18px; font-weight: 700;
		}
		.brand-name { font: 700 17px Arial, sans-serif; letter-spacing: -.5px; }
		.new-chat, .nav-item, .history-item {
			border: 0; background: transparent; color: var(--ink); text-align: left;
			width: 100%; border-radius: 10px; display: flex; align-items: center; gap: 11px;
		}
		.new-chat { padding: 12px 10px; border: 1px solid #d8ded8; background: var(--white); font: 700 13px Arial, sans-serif; }
		.new-chat span:last-child { margin-left: auto; color: var(--muted); font-size: 16px; }
		.nav { padding: 28px 0 20px; border-bottom: 1px solid var(--line); }
		.nav-item { padding: 10px; color: #505a60; font: 13px Arial, sans-serif; }
		.nav-item:hover, .history-item:hover { background: #e6ebe5; }
		.nav-item strong { width: 18px; text-align: center; color: var(--teal-deep); font-size: 15px; }
		.section-label { padding: 24px 10px 9px; color: #9aa19d; font: 10px Arial, sans-serif; text-transform: uppercase; letter-spacing: 1.5px; }
		.history-item { padding: 9px 10px; font: 12px Arial, sans-serif; color: #5e6769; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
		.history-item.active { background: #e1e9e2; color: var(--ink); }
		.history-item span { width: 4px; height: 4px; background: #aeb9b2; border-radius: 50%; flex-shrink: 0; }
		.profile { margin-top: auto; display: flex; align-items: center; gap: 9px; padding: 14px 10px 2px; border-top: 1px solid var(--line); font: 12px Arial, sans-serif; }
		.avatar { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--coral); color: white; font: 700 11px Arial, sans-serif; }
		.profile small { display: block; color: var(--muted); margin-top: 3px; }
		.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
		.topbar { height: 72px; display: flex; align-items: center; justify-content: space-between; padding: 0 42px; border-bottom: 1px solid var(--line); }
		.model { display: flex; align-items: center; gap: 8px; font: 700 13px Arial, sans-serif; }
		.status { width: 7px; height: 7px; background: #54b78e; border-radius: 50%; }
		.top-actions { display: flex; gap: 9px; }
		.icon-button { width: 34px; height: 34px; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 50%; font: 14px Arial, sans-serif; }
		.icon-button:hover { background: var(--panel); color: var(--ink); }
		.content { width: min(830px, calc(100% - 56px)); margin: 0 auto; padding: 94px 0 34px; flex: 1; }
		.intro { animation: rise .55s ease both; }
		.eyebrow { color: var(--teal-deep); font: 700 11px Arial, sans-serif; letter-spacing: 1.8px; text-transform: uppercase; }
		h1 { font-size: clamp(42px, 6vw, 74px); font-weight: 400; line-height: .98; letter-spacing: -3px; max-width: 650px; margin: 20px 0 18px; }
		h1 em { color: var(--teal-deep); font-style: normal; }
		.subhead { color: var(--muted); font-size: 18px; line-height: 1.55; max-width: 490px; margin: 0 0 48px; }
		.prompt-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; animation: rise .55s .1s ease both; }
		.prompt-card { min-height: 105px; padding: 18px; border: 1px solid var(--line); background: var(--white); border-radius: 12px; text-align: left; transition: transform .2s, box-shadow .2s, border-color .2s; }
		.prompt-card:hover { transform: translateY(-3px); border-color: #bdd8cb; box-shadow: var(--shadow); }
		.prompt-card .tag { display: block; color: var(--teal-deep); font: 10px Arial, sans-serif; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
		.prompt-card span:last-child { font-size: 16px; line-height: 1.25; }
		.model-badge { margin-left: 8px; padding: 4px 7px; border-radius: 5px; background: #e4f3eb; color: var(--teal-deep); font: 10px Arial, sans-serif; letter-spacing: .5px; }
		.composer-wrap { position: sticky; bottom: 0; width: min(830px, calc(100% - 56px)); margin: 0 auto; padding: 18px 0 25px; background: linear-gradient(var(--paper), var(--paper)); }
		.composer { background: var(--white); border: 1px solid #daddd8; border-radius: 15px; padding: 14px 14px 10px 18px; box-shadow: 0 8px 24px rgba(32, 37, 43, .07); }
		textarea { display: block; width: 100%; border: 0; outline: 0; resize: none; color: var(--ink); background: transparent; min-height: 27px; max-height: 130px; font-size: 16px; }
		textarea::placeholder { color: #a9afac; }
		.composer-bottom { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; }
		.composer-note { color: #a0a8a4; font: 11px Arial, sans-serif; }
		.composer-tools { display: flex; align-items: center; gap: 9px; }
		.mode-select, .length-select { border: 0; outline: 0; color: var(--teal-deep); background: transparent; font: 700 11px Arial, sans-serif; cursor: pointer; }
		.length-select { color: var(--muted); font-weight: 400; }
		.summary-meta { display: flex; gap: 14px; margin-top: 12px; color: #9ca6a1; font: 11px Arial, sans-serif; }
		.send { width: 35px; height: 35px; border: 0; border-radius: 10px; background: var(--ink); color: white; font: 16px Arial, sans-serif; transition: background .2s; }
		.send:hover { background: var(--teal-deep); }
		.messages { display: none; margin-bottom: 25px; }
		.message { padding: 18px 0; border-bottom: 1px solid var(--line); font-size: 18px; line-height: 1.55; }
		.message.user { color: var(--ink); font-weight: 700; }
		.message.ai { color: #4e595b; }
		.message-label { display: block; color: var(--teal-deep); font: 700 10px Arial, sans-serif; letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 8px; }
		@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
		@media (max-width: 700px) {
			.sidebar { width: 64px; padding: 18px 9px; align-items: center; }
			.brand { padding: 4px 0 25px; }
			.brand-name, .new-chat span:not(:last-child), .nav-item span, .section-label, .history-item, .profile > div { display: none; }
			.new-chat { width: 40px; height: 40px; justify-content: center; padding: 0; }
			.new-chat span:last-child { margin: 0; }
			.nav { width: 100%; }
			.nav-item { justify-content: center; padding: 13px 0; }
			.profile { padding: 14px 0 2px; }
			.topbar { height: 62px; padding: 0 18px; }
			.content, .composer-wrap { width: calc(100% - 36px); }
			.content { padding-top: 62px; }
			h1 { letter-spacing: -2px; }
			.subhead { font-size: 16px; margin-bottom: 33px; }
			.prompt-grid { grid-template-columns: 1fr; }
		}
	</style>
</head>
<body>
	<div class="app">
		<aside class="sidebar">
			<div class="brand"><div class="brand-mark">o</div><div class="brand-name">openly</div></div>
			<button class="new-chat" id="newChat"><span>New conversation</span><span>+</span></button>
			<nav class="nav" aria-label="Main navigation">
				<button class="nav-item"><strong>~</strong><span>Discover</span></button>
				<button class="nav-item"><strong>?</strong><span>Explore ideas</span></button>
			</nav>
			<div class="section-label">Recent</div>
			<button class="history-item active"><span></span> A new perspective</button>
			<button class="history-item"><span></span> Notes for a quiet morning</button>
			<button class="history-item"><span></span> Weekend meal ideas</button>
			<div class="profile"><div class="avatar">AS</div><div>Alex Stone<small>Personal space</small></div></div>
		</aside>
		<main class="main">
				<header class="topbar"><div class="model"><span class="status"></span> Openly assistant <span class="model-badge">LOCAL MODEL</span></div><div class="top-actions"><button class="icon-button" aria-label="Share conversation">↗</button><button class="icon-button" aria-label="More options">...</button></div></header>
			<section class="content">
				<div class="intro" id="welcome"><div class="eyebrow">A little room to think</div><h1>What is on your <em>mind?</em></h1><p class="subhead">Bring a question, a half-formed idea, or simply a blank page. We can start anywhere.</p></div>
				<div class="messages" id="messages"></div>
				<div class="prompt-grid" id="prompts">
					<button class="prompt-card" data-mode="summarize"><span class="tag">Summarize</span><span>Turn a long piece of text into the essentials</span></button>
					<button class="prompt-card"><span class="tag">Make something</span><span>Help me turn an idea into a plan</span></button>
					<button class="prompt-card"><span class="tag">Get curious</span><span>Explain something in a way I will remember</span></button>
					<button class="prompt-card"><span class="tag">Find clarity</span><span>Help me think through a decision</span></button>
					<button class="prompt-card"><span class="tag">Just for fun</span><span>Give me an unexpected question</span></button>
				</div>
			</section>
			<div class="composer-wrap"><form class="composer" id="composer"><textarea id="input" rows="1" aria-label="Message" placeholder="Paste text to summarize, or ask anything..."></textarea><div class="composer-bottom"><div class="composer-tools"><select class="mode-select" id="mode" aria-label="Task"><option value="chat">Chat</option><option value="summarize">Summarize text</option></select><select class="length-select" id="length" aria-label="Summary length"><option value="short">Brief</option><option value="medium" selected>Balanced</option><option value="long">Detailed</option></select></div><button class="send" aria-label="Send message">↑</button></div></form></div>
		</main>
	</div>
	<script>
		const input = document.getElementById('input');
		const form = document.getElementById('composer');
		const messages = document.getElementById('messages');
		const welcome = document.getElementById('welcome');
		const prompts = document.getElementById('prompts');
		const mode = document.getElementById('mode');
		const length = document.getElementById('length');

		const stopWords = new Set('a an and are as at be been but by for from had has have he her his i if in into is it its me my of on or our she so than that the their them then there they this to was we were what when where which who will with you your'.split(' '));

		function summarize(text, detail) {
			const sentences = text.replace(/\s+/g, ' ').match(/[^.!?]+[.!?]+|[^.!?]+$/g)?.map(sentence => sentence.trim()).filter(Boolean) || [];
			if (sentences.length < 2) return text.trim();
			const words = text.toLowerCase().match(/[a-z']+/g) || [];
			const frequencies = words.reduce((counts, word) => { if (!stopWords.has(word) && word.length > 2) counts[word] = (counts[word] || 0) + 1; return counts; }, {});
			const scored = sentences.map((sentence, index) => {
				const terms = sentence.toLowerCase().match(/[a-z']+/g) || [];
				const score = terms.reduce((sum, term) => sum + (frequencies[term] || 0), 0) / Math.max(terms.length, 1);
				return { sentence, index, score: score + (index === 0 ? .15 : 0) };
			});
			const count = detail === 'short' ? 1 : detail === 'long' ? Math.min(4, Math.ceil(sentences.length * .55)) : Math.min(3, Math.ceil(sentences.length * .35));
			return scored.sort((a, b) => b.score - a.score).slice(0, count).sort((a, b) => a.index - b.index).map(item => item.sentence).join(' ');
		}

		function escapeHtml(value) { return value.replace(/[&<>]/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[character])); }

		function submitMessage(text) {
			const cleanText = text.trim();
			if (!cleanText) return;
			welcome.style.display = 'none';
			prompts.style.display = 'none';
			messages.style.display = 'block';
			messages.innerHTML += '<div class="message user"><span class="message-label">You</span>' + escapeHtml(cleanText) + '</div>';
			if (mode.value === 'summarize') {
				const result = summarize(cleanText, length.value);
				const sourceWords = cleanText.split(/\s+/).length;
				const resultWords = result.split(/\s+/).length;
				messages.innerHTML += '<div class="message ai"><span class="message-label">Openly · Summary</span>' + escapeHtml(result) + '<div class="summary-meta"><span>' + sourceWords + ' words → ' + resultWords + ' words</span><span>Extractive summary</span></div></div>';
			} else {
				messages.innerHTML += '<div class="message ai"><span class="message-label">Openly</span>That is a thoughtful place to begin. Let us take it one small step at a time and find the useful question underneath it.</div>';
			}
			input.value = '';
			input.style.height = 'auto';
		}

		form.addEventListener('submit', event => { event.preventDefault(); submitMessage(input.value); });
		input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 130) + 'px'; });
		input.addEventListener('keydown', event => { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); form.requestSubmit(); } });
		document.querySelectorAll('.prompt-card').forEach(card => card.addEventListener('click', () => { input.value = card.innerText.split('\n').pop(); if (card.dataset.mode) mode.value = card.dataset.mode; input.focus(); }));
		mode.addEventListener('change', () => { input.placeholder = mode.value === 'summarize' ? 'Paste text to summarize...' : 'Ask anything...'; });
		document.getElementById('newChat').addEventListener('click', () => { welcome.style.display = ''; prompts.style.display = ''; messages.style.display = 'none'; messages.innerHTML = ''; input.value = ''; mode.value = 'chat'; mode.dispatchEvent(new Event('change')); input.focus(); });
	</script>
</body>
</html>
